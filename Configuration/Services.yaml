services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  T3SBS\T3sbootstrap\:
    resource: '../Classes/*'
    
  # Instantiated by the PageRenderer hook via makeInstance(), which only reaches
  # public services - without this the constructor injection above fails.
  T3SBS\T3sbootstrap\Service\CompileService:
    public: true

  T3SBS\T3sbootstrap\DataProcessing\BootstrapProcessor:
    public: true
    
  T3SBS\T3sbootstrap\DataProcessing\BsImageGalleryProcessor:
    public: true
    
  T3SBS\T3sbootstrap\DataProcessing\LastModifiedProcessor:
    public: true
    
  T3SBS\T3sbootstrap\UserFunction\TcaMatcher:
    public: true
  
  T3SBS\T3sbootstrap\DataProcessing\ConfigProcessor:
    public: true

  T3SBS\T3sbootstrap\Backend\ItemsProcFunc:
    public: true

  T3SBS\T3sbootstrap\Backend\Hooks\OutsourcedFiles:
    public: true

