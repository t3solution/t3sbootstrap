# Load default processing options
imports:
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

# Add configuration for the editor
# For complete documentation see https://ckeditor.com/docs/ckeditor5/latest/features/index.html
editor:

  config:

    # Imported YAML is merged with ArrayUtility::replaceAndAppendScalarValuesRecursive(),
    # which APPENDS plain lists instead of replacing them by index. contents.css from
    # EXT:rte_ckeditor Editor/Base.yaml is already in the list - repeating it loads it twice.
    contentsCss:
      - 'EXT:t3sbootstrap/Resources/Public/Backend/Style/rte.css'

    importModules:
      # TYPO3 loads @ckeditor/ckeditor5-basic-styles but exports only Bold, Italic,
      # Sub/Superscript, Strikethrough and Underline from it. Without this line the
      # toolbar item "code" has no plugin behind it and CKEditor drops the button.
      - { module: '@ckeditor/ckeditor5-basic-styles', exports: ['Code'] }
      - { module: '@ckeditor/ckeditor5-code-block', exports: ['CodeBlock'] }
      - { module: '@ckeditor/ckeditor5-indent', exports: ['IndentBlock'] }
      - { module: '@ckeditor/ckeditor5-show-blocks', exports: ['ShowBlocks'] }
      - { module: '@ckeditor/ckeditor5-word-count', exports: ['WordCount'] }
      - { module: '@t3sbs/t3sbootstrap/rte_ckeditor/alert-plugin.js', exports: ['AlertBox'] }
      - { module: '@t3sbs/t3sbootstrap/rte_ckeditor/columns-plugin.js', exports: ['ColumnsGrid'] }
      - { module: '@t3sbs/t3sbootstrap/rte_ckeditor/margins-plugin.js', exports: ['MarginPicker'] }
      - { module: '@t3sbs/t3sbootstrap/rte_ckeditor/badge-plugin.js', exports: ['BadgePicker'] }

    extraPlugins:
      - Indent
      - IndentBlock

    toolbar:
      items:
        - selectAll
        - '|'
        - undo
        - redo
        - '|'
        - bold
        - italic
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - blockQuote
        - '|'
        - link
        - '|'
        - removeFormat
        - '|'
        - showBlocks
        - horizontalLine
        - sourceEditing
        - '-'
        - style
        - '|'
        - heading
        - alert
        - columns
        - badge
        - '|'
        - alignment
        - margins
        - insertTable
        - findAndReplace
        - specialCharacters
        - '|'
        - code
        - codeBlock
        - outdent
        - indent

    codeBlock:
      languages:
        - { language: 'plaintext', label: 'Plain text' }
        - { language: 'typoscript', label: 'TypoScript' }
        - { language: 'php', label: 'PHP' }
        - { language: 'yaml', label: 'YAML' }
        - { language: 'json', label: 'JSON' }
        - { language: 'xml', label: 'XML' }
        - { language: 'html', label: 'HTML' }
        - { language: 'css', label: 'CSS' }
        - { language: 'scss', label: 'SCSS' }
        - { language: 'javascript', label: 'JavaScript' }
        - { language: 'bash', label: 'Bash / Shell' }
        - { language: 'sql', label: 'SQL' }

    indentBlock:
      classes:
        - 'custom-block-indent-a'
        - 'custom-block-indent-b'
        - 'custom-block-indent-c'

    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }
        - { model: 'heading4', view: 'h4', title: 'Heading 4' }
        - { model: 'heading5', view: 'h5', title: 'Heading 5' }
        - { model: 'heading6', view: 'h6', title: 'Heading 6' }
        - { model: 'formatted', view: 'pre', title: 'Pre-Formatted Text' }

    style:
      definitions:
        # Block styles (applied to <p>)
        - { name: 'Block Lead', element: 'p', classes: ['lead'], isBlock: true }
        - { name: 'Block Small', element: 'p', classes: ['small'], isBlock: true }
        - { name: 'Block Color Primary', element: 'p', classes: ['text-primary'], isBlock: true }
        - { name: 'Block Color Secondary', element: 'p', classes: ['text-secondary'], isBlock: true }
        - { name: 'Block Color Success', element: 'p', classes: ['text-success'], isBlock: true }
        - { name: 'Block Color Info', element: 'p', classes: ['text-info'], isBlock: true }
        - { name: 'Block Color Danger', element: 'p', classes: ['text-danger'], isBlock: true }
        - { name: 'Block Color Warning', element: 'p', classes: ['text-warning'], isBlock: true }
        - { name: 'Block Lowercase', element: 'p', classes: ['text-lowercase'], isBlock: true }
        - { name: 'Block Uppercase', element: 'p', classes: ['text-uppercase'], isBlock: true }
        - { name: 'Block Capitalize', element: 'p', classes: ['text-capitalize'], isBlock: true }
        - { name: 'Block Indent', element: 'p', classes: ['text-indent'], isBlock: true }

        # Inline text styles
        - { name: 'Mark', element: 'span', classes: ['mark'] }
        - { name: 'Del', element: 'del', classes: ['del'] }
        - { name: 'Ins', element: 'ins', classes: ['ins'] }
        - { name: 'Code', element: 'code', classes: [] }
        - { name: 'Text Lead', element: 'span', classes: ['lead'] }
        - { name: 'Text Small', element: 'span', classes: ['small'] }
        - { name: 'Text Color Primary', element: 'span', classes: ['text-primary'] }
        - { name: 'Text Color Secondary', element: 'span', classes: ['text-secondary'] }
        - { name: 'Text Color Success', element: 'span', classes: ['text-success'] }
        - { name: 'Text Color Info', element: 'span', classes: ['text-info'] }
        - { name: 'Text Color Danger', element: 'span', classes: ['text-danger'] }
        - { name: 'Text Color Warning', element: 'span', classes: ['text-warning'] }
        - { name: 'Text Lowercase', element: 'span', classes: ['text-lowercase'] }
        - { name: 'Text Uppercase', element: 'span', classes: ['text-uppercase'] }
        - { name: 'Text Capitalize', element: 'span', classes: ['text-capitalize'] }
        - { name: 'Text Indent', element: 'span', classes: ['text-indent'] }

        # Buttons
        - { name: 'Button Primary', element: 'a', classes: ['btn', 'btn-primary'] }
        - { name: 'Button Secondary', element: 'a', classes: ['btn', 'btn-secondary'] }
        - { name: 'Button Success', element: 'a', classes: ['btn', 'btn-success'] }
        - { name: 'Button Danger', element: 'a', classes: ['btn', 'btn-danger'] }
        - { name: 'Button Warning', element: 'a', classes: ['btn', 'btn-warning'] }
        - { name: 'Button Info', element: 'a', classes: ['btn', 'btn-info'] }
        - { name: 'Button Light', element: 'a', classes: ['btn', 'btn-light'] }
        - { name: 'Button Dark', element: 'a', classes: ['btn', 'btn-dark'] }

        # Since 5.3.51 badges and pill badges are a toolbar dropdown (badge-plugin.js,
        # toolbar item "badge"), not Styles entries; the markup is unchanged, so no
        # migration. Re-adding them here would give the same class two rival edit paths.

        # Lists
        - { name: 'List Unstyled', element: 'ul', classes: ['list-unstyled'] }
        - { name: 'List Inline', element: 'ul', classes: ['list-inline'] }

        # Tables
        - { name: 'Table', element: 'table', classes: ['table'] }
        - { name: 'Table Hover', element: 'table', classes: ['table', 'table-hover'] }
        - { name: 'Table Striped', element: 'table', classes: ['table', 'table-striped'] }

    alignment:
      options:
        - { name: 'left', className: 'text-start' }
        - { name: 'center', className: 'text-center' }
        - { name: 'right', className: 'text-end' }
        - { name: 'justify', className: 'text-justify' }

    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties

    htmlSupport:
      allowEmpty:
        - 'div'
        - 'span'
      allow:
        - name: 'div'
          attributes: true
          classes: true
          styles: true
        - name: 'span'
          classes: true
