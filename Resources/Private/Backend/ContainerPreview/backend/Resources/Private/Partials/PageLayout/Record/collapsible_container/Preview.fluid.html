<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
   xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers/" 
   data-namespace-typo3-fluid="true">
<f:if condition="{item.editable} && {allowEditContent}">
	<div class="element-preview-header">
		<f:if condition="{item.record.header}">
			<div class="element-preview-header-header">
		        <a class="element-preview-header-header" href="{item.editUrl}" 
			        title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:edit')}">
		            {item.record.header}
		        </a>
			</div>
		</f:if>
		<f:if condition="{item.record.subheader}">
			<div class="element-preview-header-subheader">
		        <a class="element-preview-header-header" href="{item.editUrl}" 
			        title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:edit')}">
		            {item.record.subheader}
		        </a>
			</div>
		</f:if>
	</div>
	<f:variable name="flexForm" value="<t3sb:flexform uid='{item.record.uid}' />" />

	<div class="d-flex">
		<div class="flex-grow-1 ms-0 flex-info-content">
	
			<strong>Appearance:</strong> {flexForm.appearance}
		
			<f:if condition="{flexForm.alwaysOpen}">
				<f:then>
					| <strong>Always open:</strong> true
				</f:then>
				<f:else>
					| <strong>Always open:</strong> false
				</f:else>
			</f:if>
			<f:if condition="{flexForm.flush}">
				<f:then>
					| <strong>Flush:</strong> true
				</f:then>
				<f:else>
					| <strong>Flush:</strong> false
				</f:else>
			</f:if>
		
		</div>
	</div>

</f:if>
<f:render partial="PageLayout/Record/ContainerPreview" arguments="{_all}" />
</html>
