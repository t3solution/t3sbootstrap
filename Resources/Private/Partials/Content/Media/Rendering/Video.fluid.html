<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	xmlns:t3sb="http://typo3.org/ns/T3SBS/T3sbootstrap/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment> Poster for the video - only if PNG- or JPG-image with the name of the video is availabe in fileadmin/user_upload/ </f:comment>
<f:comment>
	playsinline: TYPO3's VideoTagRenderer does not know the attribute - it only
	writes controls, autoplay, muted and loop. A <video autoplay> without
	playsinline goes straight into fullscreen on the iPhone while the page loads:
	all that is visible then is the video on a black background. Carousel and
	jumbotron have long set the attribute themselves, here it was missing.
</f:comment>
<f:if condition="{poster}">
	<f:then>
		<t3sb:media
			class="{class}"
			file="{file}"
			width="{dimensions.width}"
			height="{dimensions.height}"
			alt="{file.alternative}"
			title="{file.title}"
			additionalAttributes="{poster: poster, playsinline: 'playsinline'}" />
	</f:then>
	<f:else>
		<t3sb:media
			class="{class}"
			file="{file}"
			width="{dimensions.width}"
			height="{dimensions.height}"
			alt="{file.alternative}"
			title="{file.title}"
			additionalAttributes="{playsinline: 'playsinline'}" />
	</f:else>
</f:if>
</html>
