<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
 xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers/" data-namespace-typo3-fluid="true">
<f:variable name="imgObject" value="" />
<f:variable name="margin" value="0" />
<f:if condition="{record.assets}">
	<f:variable name="imgObject" value="<t3sb:backend.infoImage uid='{record.uid}' />" />
	<f:variable name="margin" value="2" />
</f:if>
<f:variable name="imagewidth" value="auto" />
<f:if condition="{record.imagewidth}">
	<f:variable name="imagewidth" value="{record.imagewidth}px" />
</f:if>

<f:format.crop maxCharacters="100" respectWordBoundaries="true" respectHtml="false">
{record.bodytext -> f:format.raw()}
</f:format.crop>

<div class="d-flex">
	<f:if condition="{imgObject.0}">
		<div class="flex-shrink-0">
			<be:thumbnail image="{imgObject.0}" width="64" height="45" class="img-thumbnail" />
		</div>
	</f:if>
	<div class="flex-grow-1 ms-{margin} flex-info-content">

		<strong>Image width:</strong> {imagewidth}
		<f:if condition="{record.tx_t3sbootstrap_image_ratio}">
			| <strong>Image Ratio:</strong> {record.tx_t3sbootstrap_image_ratio}
		</f:if>
		<f:if condition="{record.imageorient} == 90">
			| <strong>Alignment:</strong> Default
		</f:if>
		<f:if condition="{record.imageorient} == 91">
			| <strong>Alignment:</strong> Center
		</f:if>
		<f:if condition="{record.imageorient} == 92">
			| <strong>Alignment:</strong> Top
		</f:if>
		<f:if condition="{record.imageorient} == 93">
			| <strong>Alignment:</strong> Bottom
		</f:if>
		<f:if condition="{record.tx_t3sbootstrap_flexform.order}">
			| <strong>Position:</strong> {record.tx_t3sbootstrap_flexform.order}
		</f:if>

	</div>
</div>

</html>
